<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one calm column, five-minute habit. Header, tab content, fixed bottom tabs, bottom sheet for entry forms. */
:root{
  --bg:#ECF0EB;          /* sage-tinted paper */
  --surface:#F6F8F4;     /* raised panels */
  --sunken:#E2E9E3;      /* inputs, tracks */
  --ink:#24312B;         /* text */
  --ink2:#587064;        /* muted text */
  --line:#D2DCD4;        /* hairlines */
  --accent:#3E7460;      /* deep sage */
  --accent-ink:#F3F8F4;
  --accent-soft:#D7E6DD;
  --pr:#98651C;          /* PR amber text */
  --pr-soft:#F0E3CB;
  --calm:#6D8FA2;        /* slate blue for secondary marks */
  --danger:#A0453C;
  --scrim:rgba(28,40,34,.42);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B18;--surface:#1C2521;--sunken:#121814;--ink:#E1EAE4;--ink2:#9AAEA2;--line:#2B3731;
  --accent:#8CC4A7;--accent-ink:#10201A;--accent-soft:#25382F;--pr:#E2B96F;--pr-soft:#3A301B;--calm:#8EB0C4;--danger:#E58D83;--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B18;--surface:#1C2521;--sunken:#121814;--ink:#E1EAE4;--ink2:#9AAEA2;--line:#2B3731;
  --accent:#8CC4A7;--accent-ink:#10201A;--accent-soft:#25382F;--pr:#E2B96F;--pr-soft:#3A301B;--calm:#8EB0C4;--danger:#E58D83;--scrim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
h1{font:italic 300 clamp(2.5rem,11vw,3.4rem)/1.05 var(--display);letter-spacing:-.01em;margin-top:4px;text-wrap:balance}
.wave{width:150px;height:14px;margin-top:6px;display:block}
.wave path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;opacity:.65}

/* banner */
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:baseline}
.note b{font-weight:600}

/* section scaffolding */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2{font:500 1.4rem/1.2 var(--display);letter-spacing:-.005em}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.muted{color:var(--ink2);font-size:.88rem}
.panel{background:var(--surface);border-radius:16px;padding:4px 16px}
.panel.pad{padding:16px}
.row{padding:14px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.empty{padding:22px 4px;color:var(--ink2);text-align:center}

/* buttons */
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:38px;padding:0 14px;font-size:.9rem}
.btn:hover{filter:brightness(1.04)}
.link{background:none;border:0;padding:8px 0;min-height:40px;color:var(--accent);font-weight:600;cursor:pointer;font-size:.9rem}
.link.danger{color:var(--danger)}
.actions{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}

/* today */
.week{display:flex;flex-direction:column;gap:16px}
.week-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big{font:400 3.4rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.col .n{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.col .b{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--calm);opacity:.55}
.col.now .b{background:var(--accent);opacity:1}
.col.now .n{color:var(--accent)}
.col .w{font-size:.68rem;color:var(--ink2);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{display:flex;flex-direction:column;gap:2px;padding:4px 14px}
.stat + .stat{border-left:1px solid var(--line)}
.stat:first-child{padding-left:0}
.stat .v{font:500 1.9rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{font-size:.78rem;color:var(--ink2)}

/* PRs */
.pr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pr-top h3{font:600 1.02rem/1.3 var(--body)}
.pr-val{font:500 1.7rem/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-meta{display:flex;justify-content:space-between;align-items:center;gap:12px}
.delta{font-size:.84rem;color:var(--accent);font-weight:600}
.spark{width:96px;height:32px;flex:none}
.spark polyline{fill:none;stroke:var(--calm);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.hist{display:flex;flex-direction:column;margin-top:2px}
.hist li{list-style:none;display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line);font-size:.92rem}
.hist{padding:0;margin:0}
.hist .v{font-weight:600;font-variant-numeric:tabular-nums}
.hist .nt{grid-column:1 / -1;color:var(--ink2);font-size:.84rem}
.tag{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--pr);background:var(--pr-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}

/* goals */
.track{height:10px;background:var(--sunken);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.g-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.g-head h3{font:600 1.02rem/1.3 var(--body)}
.g-pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.g-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86rem;color:var(--ink2)}
details.done summary{cursor:pointer;list-style:none;font-weight:600;color:var(--ink2);padding:6px 0;min-height:40px;display:flex;align-items:center}
details.done summary::-webkit-details-marker{display:none}

/* wins */
.month{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding-top:6px}
.win{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.win .d{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:3.6em;padding-top:2px}
.win h3{font:600 1rem/1.35 var(--body)}
.win .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.win .body p{color:var(--ink2);font-size:.9rem;overflow-wrap:anywhere}

/* sessions */
.sess{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.sess h3{font:600 1rem/1.3 var(--body)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.sess .nt{grid-column:1 / -1;color:var(--ink2);font-size:.88rem;overflow-wrap:anywhere}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{flex:1;text-align:center}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:center;font-weight:600;padding:4px 0}
.day{aspect-ratio:1/1;max-width:100%;max-height:56px;width:100%;border:0;border-radius:12px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:.95rem;min-width:0;padding:0}
.day:hover{background:var(--sunken)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.day .pips{display:flex;gap:3px;height:6px}
.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day.sel .pips i{background:var(--accent-ink)}
.cal-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.dsec{display:flex;flex-direction:column;gap:2px}
.dsec .label{color:var(--accent)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.snip{grid-column:1 / -1;color:var(--ink2);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snip b{font-weight:600;color:var(--ink)}
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sess-top h3{font:600 1rem/1.3 var(--body)}

/* timer */
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mbtn{min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--sunken);font-weight:500;font-size:.92rem;cursor:pointer}
.mbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.clock{border-radius:22px;padding:22px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface)}
.clock.work{background:var(--accent-soft)}
.clock.rest{background:var(--sunken)}
.clock.prep{background:var(--pr-soft)}
.clock .ph{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.clock.work .ph{color:var(--accent)}
.clock.prep .ph{color:var(--pr)}
.clock .tt{font:400 clamp(4rem,23vw,6.4rem)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock .rd{font-size:1.05rem;font-weight:600;min-height:1.5em}
.clock .tot{font-size:.9rem;color:var(--ink2);font-variant-numeric:tabular-nums;min-height:1.4em}
.clock .track{width:100%;max-width:360px;background:var(--bg);opacity:.9}
.t-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.t-actions .btn{min-width:120px}
.tally{display:flex;align-items:center;justify-content:center;gap:14px}
.tally .n{font:500 2.4rem/1 var(--display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.tally .btn.round{width:64px;height:64px;padding:0;font-size:1.6rem}
.sum{font-size:.92rem;color:var(--ink2)}
.done-card{display:flex;flex-direction:column;gap:6px;align-items:center}
.done-card .res{font:500 1.5rem/1.25 var(--display);text-wrap:balance}

/* search */
input[type=search]{width:100%;min-height:48px;background:var(--sunken);border:1px solid transparent;border-radius:12px;padding:10px 14px;-webkit-appearance:none;appearance:none}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip[aria-pressed="true"]{background:var(--accent);border:1px solid transparent;color:var(--accent-ink);font-weight:600}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;min-width:0}
.hit .t{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.hit .sn{display:block;margin-top:4px;color:var(--ink2);font-size:.9rem;overflow-wrap:anywhere}
.hit .sn b{color:var(--accent);font-weight:600}
mark{background:var(--pr-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.res-count{font-size:.84rem;color:var(--ink2)}

/* bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:0}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink2);text-decoration:none;font-size:.62rem;font-weight:600;min-height:52px;justify-content:center}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(560px,100%);max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:20px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field > label,.field > legend{font-size:.8rem;font-weight:600;color:var(--ink2);padding:0}
input[type=text],input[type=number],input[type=date],select,textarea,input:not([type]){width:100%;min-height:46px;background:var(--sunken);border:1px solid transparent;border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{position:relative;cursor:pointer}
.pills input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.pills span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sunken);font-size:.9rem;font-weight:500}
.pills input:checked + span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pills input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;min-height:36px;padding:0 12px;font-size:.84rem;color:var(--ink2);cursor:pointer}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

/* ---------- small helpers ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseYmd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){return ymd(new Date())};
var addDays=function(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
var mondayOf=function(s){var d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
var diffDays=function(a,b){return Math.round((parseYmd(a)-parseYmd(b))/864e5)};
var fmtDate=function(s){var d=parseYmd(s);var t=new Date();return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==t.getFullYear()?' '+d.getFullYear():'')};
var num=function(v){return Number.isInteger(v)?String(v):String(Math.round(v*100)/100)};
function fmtTime(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+':'+pad(m)+':'+pad(r):m+':'+pad(r)}
function fmtVal(u,v){return u==='time'?fmtTime(v):u==='reps'?num(v)+' reps':num(v)+' '+u}
function parseVal(u,s){s=String(s).trim().replace(',','.');if(!s)return NaN;
  if(u==='time'&&s.indexOf(':')>-1){var p=s.split(':').map(Number);if(p.some(isNaN))return NaN;return p.reduce(function(a,x){return a*60+x},0)}
  return parseFloat(s)}
function better(u,a,b){return u==='time'?a<b:a>b}
function delta(u,first,best){var d=u==='time'?first-best:best-first;if(d<=0)return '';return u==='time'?fmtTime(d)+' faster':'+'+num(d)+' '+u}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- example data (shown only until the first real entry) ---------- */
function sampleItems(){
  var t=today(),mon=mondayOf(t),out=[],n=0;
  var id=function(){return 's'+(n++)};
  var pat=[[0,1,3],[0,1,3,4],[0,2],[0,1,3,5],[0,2,4],[0,1,2,4,5],[0,2,3]];
  for(var w=0;w<8;w++){
    var days=w===0?[0,1,3]:pat[(w-1)%pat.length];
    days.forEach(function(d,k){var date=addDays(mon,-7*w+d);if(date<=t)out.push(Object.assign({id:id(),kind:'session',date:date,feel:3+((w+k)%3),note:k===0&&w===0?'Easy pace, clean reps.':'',sample:1},SAMPLE_BLOCKS[(w+k)%3]))});
  }
  var P=function(m,u,off,v,note){out.push({id:id(),kind:'pr',move:m,unit:u,value:v,date:addDays(t,off),note:note||'',sample:1})};
  P('Back Squat','kg',-84,100);P('Back Squat','kg',-56,105);P('Back Squat','kg',-28,110);P('Back Squat','kg',-9,115,'Felt smooth out of the hole.');
  P('Deadlift','kg',-70,130);P('Deadlift','kg',-35,140);P('Deadlift','kg',-14,150);
  P('Fran','time',-80,372);P('Fran','time',-45,348);P('Fran','time',-12,321,'Unbroken first set.');
  P('Max Pull-ups','reps',-60,8);P('Max Pull-ups','reps',-20,11);
  out.push({id:id(),kind:'goal',title:'Back squat 125 kg',move:'Back Squat',unit:'kg',start:100,target:125,current:115,due:addDays(t,50),sample:1});
  out.push({id:id(),kind:'goal',title:'Fran under 5:00',move:'Fran',unit:'time',start:372,target:300,current:321,due:addDays(t,90),sample:1});
  out.push({id:id(),kind:'goal',title:'Three rope climbs in a row',move:'',unit:'reps',start:0,target:3,current:1,due:'',sample:1});
  out.push({id:id(),kind:'win',title:'First strict pull-up',date:addDays(t,-75),note:'Took a year of ring rows.',sample:1});
  out.push({id:id(),kind:'win',title:'Back squat hit 100 kg',date:addDays(t,-84),note:'',sample:1});
  out.push({id:id(),kind:'win',title:'Showed up 4 weeks in a row',date:addDays(t,-22),note:'',sample:1});
  return out;
}

/* ---------- storage: private per-viewer db, with a device-only fallback ---------- */
var items=[],loaded=false,mode='pending',col=null;
var LS='slowfast.v1';
function loadLocal(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):[]}catch(e){return []}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}
function goLocal(){mode='local';items=loadLocal();loaded=true;render()}
var store={
  add:function(d){d.createdAt=Date.now();
    if(mode==='db')return col.add(d);
    d.id=uid();items=items.concat([d]);saveLocal();render();return Promise.resolve()},
  patch:function(id,p){
    if(mode==='db')return col.doc(id).update(p);
    items=items.map(function(i){return i.id===id?Object.assign({},i,p):i});saveLocal();render();return Promise.resolve()},
  remove:function(id){
    if(mode==='db')return col.doc(id).delete();
    items=items.filter(function(i){return i.id!==id});saveLocal();render();return Promise.resolve()}
};
async function initStore(){
  if(!(window.claude&&window.claude.use)){goLocal();return}
  try{
    var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    var db=r[0],user=r[1],id=user?await user.id():null;
    if(db&&id){
      col=db.collection('data/users/'+id);mode='db';
      col.onSnapshot(function(snap){
        items=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
        loaded=true;render();
      },function(){if(mode==='db'){goLocal()}});
      return;
    }
  }catch(e){}
  goLocal();
}

/* ---------- derived data ---------- */
function view(){return items.length?items:sampleItems()}
function prGroups(list){
  var m=new Map();
  list.filter(function(i){return i.kind==='pr'}).forEach(function(p){
    var k=p.move.trim().toLowerCase()+'|'+p.unit;
    if(!m.has(k))m.set(k,{key:k,name:p.move.trim(),unit:p.unit,entries:[]});
    m.get(k).entries.push(Object.assign({},p));
  });
  var gs=[];
  m.forEach(function(g){
    g.entries.sort(function(a,b){return a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0)});
    var best=null;g.bestEntry=null;
    g.entries.forEach(function(e){e.isPR=best===null||better(g.unit,e.value,best);if(e.isPR){best=e.value;g.bestEntry=e}});
    g.best=best;g.first=g.entries[0];g.last=g.entries[g.entries.length-1];gs.push(g);
  });
  return gs.sort(function(a,b){return b.bestEntry.date.localeCompare(a.bestEntry.date)});
}
function goalCurrent(g,groups){
  if(g.move){var grp=groups.find(function(x){return x.name.toLowerCase()===g.move.trim().toLowerCase()&&x.unit===g.unit});if(grp)return grp.best}
  return g.current==null?g.start:g.current;
}
function goalPct(g,cur){var span=g.target-g.start;if(span===0)return cur===g.target?1:0;return Math.max(0,Math.min(1,(cur-g.start)/span))}
function dueText(g){
  if(!g.due)return 'No deadline';
  var n=diffDays(g.due,today());
  if(n>1)return n+' days left';if(n===1)return '1 day left';if(n===0)return 'Due today';
  return 'Past due by '+(-n)+(n===-1?' day':' days');
}

var tab='today',openKeys=new Set();
var calSel=today(),calMonth=today().slice(0,7)+'-01';
var searchQ='',searchBlock='all';
var isSample=function(){return items.length===0};

function spark(g){
  var v=g.entries.map(function(e){return e.value});if(v.length<2)return '';
  var lo=Math.min.apply(null,v),hi=Math.max.apply(null,v),W=96,H=32,p=4;
  var pts=v.map(function(x,i){var t=hi===lo?.5:(x-lo)/(hi-lo);var y=g.unit==='time'?t:1-t;return [p+i*(W-2*p)/(v.length-1),p+y*(H-2*p)]});
  var last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 96 32" aria-hidden="true"><polyline points="'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2"/></svg>';
}
function dotsHTML(s){
  var dots='';for(var i=1;i<=5;i++)dots+='<i class="'+(i<=s.feel?'on':'')+'"></i>';
  return '<span class="dots" role="img" aria-label="Felt '+esc(FEEL[s.feel-1]||'')+'">'+dots+'</span>';
}
function snippet(s){
  for(var i=0;i<SNIP_ORDER.length;i++){var k=SNIP_ORDER[i];if(s[k]){var lbl=SECTIONS.filter(function(x){return x[0]===k})[0][1];return '<b>'+lbl+'</b> '+esc(String(s[k]).split('\n')[0])}}
  return s.note?esc(s.note):'';
}
/* compact row for the Today tab */
function sessRow(s){

/* full session with all five blocks, for the calendar tab */
function sessDetail(s,sample){
  var h='<div class="row"><div class="sess-top"><h3>'+esc(s.type||'Session')+'</h3>'+dotsHTML(s)+'</div>';
  var any=false;
  SECTIONS.forEach(function(x){if(s[x[0]]){any=true;h+='<div class="dsec"><span class="label">'+x[1]+'</span><p class="txt">'+esc(s[x[0]])+'</p></div>'}});
  if(s.note){any=true;h+='<div class="dsec"><span class="label" style="color:var(--ink2)">Notes</span><p class="txt">'+esc(s.note)+'</p></div>'}
  if(!any)h+='<p class="muted">No details written for this session.</p>';
  if(!sample)h+='<div class="actions"><button class="link" data-act="edit-session" data-id="'+esc(s.id)+'">Edit</button><button class="link danger" data-act="del" data-id="'+esc(s.id)+'">Delete</button></div>';
  return h+'</div>';

function prRow(g,full,sample){
  var open=openKeys.has(g.key),d=delta(g.unit,g.first.value,g.best);
  var h='<div class="row"><div class="pr-top"><div><h3>'+esc(g.name)+'</h3><p class="muted">Best on '+fmtDate(g.bestEntry.date)+'</p></div><div class="pr-val">'+esc(fmtVal(g.unit,g.best))+'</div></div>'+
    '<div class="pr-meta"><span class="delta">'+(d?esc(d)+' since '+fmtDate(g.first.date):(g.entries.length>1?'Holding steady':'First entry'))+'</span>'+spark(g)+'</div>';
  if(full){
    h+='<div class="actions"><button class="link" data-act="toggle" data-key="'+esc(g.key)+'" aria-expanded="'+open+'">History ('+g.entries.length+')</button></div>';
    if(open){
      h+='<ul class="hist">'+g.entries.slice().reverse().map(function(e){
        return '<li><span>'+fmtDate(e.date)+(e.isPR?'<span class="tag">PR</span>':'')+'</span><span class="v">'+esc(fmtVal(g.unit,e.value))+'</span>'+
          (sample?'<span></span>':'<button class="link danger" data-act="del" data-id="'+esc(e.id)+'">Delete</button>')+
          (e.note?'<span class="nt">'+esc(e.note)+'</span>':'')+'</li>'}).join('')+'</ul>';
    }
  }
  return h+'</div>';
}
function goalRow(g,groups,sample){
  var cur=goalCurrent(g,groups),pct=goalPct(g,cur),linked=!!g.move&&groups.some(function(x){return x.name.toLowerCase()===g.move.trim().toLowerCase()&&x.unit===g.unit});
  var pc=Math.round(pct*100);
  var h='<div class="row"><div class="g-head"><h3>'+esc(g.title)+'</h3><span class="g-pct">'+pc+'%</span></div>'+
    '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'" aria-label="'+esc(g.title)+'"><div class="fill" style="width:'+pc+'%"></div></div>'+
    '<div class="g-meta"><span>Now '+esc(fmtVal(g.unit,cur))+' · Target '+esc(fmtVal(g.unit,g.target))+'</span><span>'+(g.done?'Reached '+fmtDate(g.doneAt):esc(dueText(g)))+'</span></div>';
  if(!sample){
    h+='<div class="actions">';
    if(!g.done){
      if(!linked)h+='<button class="link" data-act="progress" data-id="'+esc(g.id)+'">Update progress</button>';
      else h+='<span class="muted">Follows your '+esc(g.move)+' PRs</span>';
      h+='<button class="'+(pct>=1?'btn small':'link')+'" data-act="reach" data-id="'+esc(g.id)+'">Mark reached</button>';
    }
    h+='<button class="link danger" data-act="del" data-id="'+esc(g.id)+'">Delete</button></div>';
  }
  return h+'</div>';
}

function viewToday(){
  var list=view(),sample=isSample(),t=today(),wk=mondayOf(t);
  var sess=list.filter(function(i){return i.kind==='session'});
  var weeks=[];for(var i=7;i>=0;i--)weeks.push(addDays(wk,-7*i));
  var counts=weeks.map(function(w){return sess.filter(function(s){return mondayOf(s.date)===w}).length});
  var mx=Math.max(1,Math.max.apply(null,counts)),prevAvg=counts.slice(0,7).reduce(function(a,b){return a+b},0)/7;
  var groups=prGroups(list);
  var recentPR=0;groups.forEach(function(g){g.entries.forEach(function(e){if(e.isPR&&e.date>=addDays(t,-30))recentPR++})});
  var goals=list.filter(function(i){return i.kind==='goal'&&!i.done}),wins=list.filter(function(i){return i.kind==='win'});
  var bars=counts.map(function(c,k){var d=parseYmd(weeks[k]);
    return '<div class="col'+(k===7?' now':'')+'"><span class="n">'+c+'</span><div class="b" style="height:'+(c?Math.max(8,Math.round(c/mx*84)):3)+'px"></div><span class="w">'+d.getDate()+' '+MONTHS[d.getMonth()]+'</span></div>'}).join('');
  var recent=sess.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,4);

  '<section class="sec"><div class="sec-head"><h2>This week</h2><button class="btn small" data-act="add-session">Log a session</button></div>'+
    '<div class="panel pad week"><div class="week-top"><span class="big">'+counts[7]+'</span><span class="muted">'+(counts[7]===1?'session':'sessions')+' since Monday<br>Usual week: '+(Math.round(prevAvg*10)/10)+'</span></div>'+
    '<div class="bars" role="img" aria-label="Sessions per week, last 8 weeks: '+counts.join(', ')+'">'+bars+'</div></div></section>'+
  '<section class="stats" aria-label="Totals"><div class="stat"><span class="v">'+recentPR+'</span><span class="k">PRs in 30 days</span></div><div class="stat"><span class="v">'+goals.length+'</span><span class="k">Goals in progress</span></div><div class="stat"><span class="v">'+wins.length+'</span><span class="k">Wins logged</span></div></section>'+
  '<section class="sec"><div class="sec-head"><h2>Latest PRs</h2><a class="link" href="#prs" style="text-decoration:none">All PRs</a></div><div class="panel">'+
    (topPR.length?topPR.map(function(g){return prRow(g,false,sample)}).join(''):'<p class="empty">No PRs yet. Your first one counts.</p>')+'</div></section>'+
  '<section class="sec"><div class="sec-head"><h2>Goals in motion</h2><a class="link" href="#goals" style="text-decoration:none">All goals</a></div><div class="panel">'+
    (topGoals.length?topGoals.map(function(g){return goalRow(g,groups,true)}).join(''):'<p class="empty">Set a goal and watch it fill in.</p>')+'</div></section>'+
  '<section class="sec"><h2>Recent sessions</h2><div class="panel">'+
    (recent.length?recent.map(function(s){return sessRow(s,false)}).join(''):'<p class="empty">Nothing logged yet.</p>')+'</div></section></div>';
}

/* search: sessions by block text and notes, PRs by movement and note */
function hl(text,terms){
  text=String(text);var low=text.toLowerCase(),spans=[];
  terms.forEach(function(t){var i=0;while(t&&(i=low.indexOf(t,i))>-1){spans.push([i,i+t.length]);i+=t.length}});
  spans.sort(function(a,b){return a[0]-b[0]});
  var out='',pos=0;
  spans.forEach(function(s){if(s[0]<pos){if(s[1]>pos){out+='<mark>'+esc(text.slice(pos,s[1]))+'</mark>';pos=s[1]}return}out+=esc(text.slice(pos,s[0]))+'<mark>'+esc(text.slice(s[0],s[1]))+'</mark>';pos=s[1]});
  return out+esc(text.slice(pos));
}
function windowAround(text,terms){
  var low=text.toLowerCase(),at=-1;
  terms.forEach(function(t){var i=low.indexOf(t);if(i>-1&&(at<0||i<at))at=i});
  if(at<0)return text.length>110?text.slice(0,110)+'…':text;
  var s=Math.max(0,at-35),e=Math.min(text.length,at+75);

function searchResultsHTML(){
  var list=view(),q=searchQ.trim().toLowerCase(),terms=q.split(/\s+/).filter(Boolean);

    if(!terms.length&&!fields.some(function(f){return s[f[0]]}))return;

  });

    var d=parseYmd(s.date),lines='';

      var v=s[f[0]];if(!v)return;

      var first=String(v).split('\n').join(' ');

  }).join('')+'</div>';
  if(hits.length>shown.length)h+='<p class="res-count">Showing the latest 50. Add a word to narrow it down.</p>';
  if(prHits.length){
    h+='<h2 style="margin-top:8px">PRs</h2><div class="panel">'+prHits.map(function(g){
      return '<div class="row"><div class="pr-top"><div><h3>'+hl(g.name,terms)+'</h3><p class="muted">Best on '+fmtDate(g.bestEntry.date)+'</p></div><div class="pr-val">'+esc(fmtVal(g.unit,g.best))+'</div></div><div class="actions"><button class="link" data-act="openpr" data-key="'+esc(g.key)+'">See history</button></div></div>';
    }).join('')+'</div>';

/* ---------- timer: EMOM, Tabata, AMRAP, For Time, custom intervals ---------- */
var TKEY='slowfast.timer';
var TDEF={mode:'emom',emomMin:10,emomSec:60,tabRounds:8,tabWork:20,tabRest:10,amrapMin:12,ftCap:0,ivRounds:5,ivWork:40,ivRest:20,sound:true};
var TMODES=[['emom','EMOM'],['tabata','Tabata'],['amrap','AMRAP'],['fortime','For time'],['intervals','Intervals']];
var TFIELDS={
  emom:[['emomMin','Total minutes'],['emomSec','Every (seconds)']],
  tabata:[['tabRounds','Rounds'],['tabWork','Work (seconds)'],['tabRest','Rest (seconds)']],
  amrap:[['amrapMin','Minutes']],
  fortime:[['ftCap','Time cap, minutes (0 for none)']],
  intervals:[['ivRounds','Rounds'],['ivWork','Work (seconds)'],['ivRest','Rest (seconds)']]
};
var PREP=10;
var T={cfg:(function(){try{return Object.assign({},TDEF,JSON.parse(localStorage.getItem(TKEY)||'{}'))}catch(e){return Object.assign({},TDEF)}})(),
  status:'idle',phases:[],total:0,accum:0,lastTs:0,idx:-1,lastRem:-1,rounds:0,iv:null,ac:null,wake:null,result:null};
function tSave(){try{localStorage.setItem(TKEY,JSON.stringify(T.cfg))}catch(e){}}
function tn(k){var v=Math.floor(Number(T.cfg[k])||0);return Math.max(k==='ftCap'?0:1,v)}
function clk(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)}
function tBuild(){
  var m=T.cfg.mode,ph=[{label:'Get ready',secs:PREP,kind:'prep'}];
  if(m==='emom'){var sec=tn('emomSec'),n=Math.max(1,Math.floor(tn('emomMin')*60/sec));
    for(var i=1;i<=n;i++)ph.push({label:sec===60?'Minute '+i:'Interval '+i,secs:sec,kind:'work',round:i,of:n})}
  else if(m==='tabata'||m==='intervals'){var p=m==='tabata'?['tabRounds','tabWork','tabRest']:['ivRounds','ivWork','ivRest'],n2=tn(p[0]);
    for(var j=1;j<=n2;j++){ph.push({label:'Work',secs:tn(p[1]),kind:'work',round:j,of:n2});if(j<n2)ph.push({label:'Rest',secs:tn(p[2]),kind:'rest',round:j,of:n2})}}
  else if(m==='amrap')ph.push({label:'AMRAP',secs:tn('amrapMin')*60,kind:'work'});
  else ph.push({label:'For time',secs:tn('ftCap')?tn('ftCap')*60:Infinity,kind:'work',up:true});
  var s=0;ph.forEach(function(p){p.start=s;s+=p.secs*1000});
  T.phases=ph;T.total=s;
}
function tSummaryLine(){
  var m=T.cfg.mode;
  if(m==='emom'){var sec=tn('emomSec'),n=Math.max(1,Math.floor(tn('emomMin')*60/sec));return n+(n===1?' round':' rounds')+' of '+sec+' s · '+clk(n*sec)+' total'}
  if(m==='tabata'||m==='intervals'){var p=m==='tabata'?['tabRounds','tabWork','tabRest']:['ivRounds','ivWork','ivRest'],n2=tn(p[0]);return n2+' rounds · '+tn(p[1])+' s on, '+tn(p[2])+' s off · '+clk(n2*tn(p[1])+(n2-1)*tn(p[2]))+' total'}
  if(m==='amrap')return 'As many rounds as possible in '+tn('amrapMin')+' min';
  return tn('ftCap')?'Stopwatch with a '+tn('ftCap')+' min cap':'Stopwatch, no cap';
}
function tElapsed(){return T.accum+(T.status==='running'?Date.now()-T.lastTs:0)}
function tBeep(f,ms,delay){
  if(!T.cfg.sound||!T.ac)return;
  try{var o=T.ac.createOscillator(),g=T.ac.createGain(),t0=T.ac.currentTime+(delay||0)/1000;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+ms/1000);
    o.connect(g);g.connect(T.ac.destination);o.start(t0);o.stop(t0+ms/1000+0.02)}catch(e){}
}
async function tWake(on){
  try{
    if(on&&navigator.wakeLock&&!T.wake){T.wake=await navigator.wakeLock.request('screen');T.wake.addEventListener('release',function(){T.wake=null})}
    if(!on&&T.wake){await T.wake.release();T.wake=null}
  }catch(e){T.wake=null}
}
function tLocate(e){for(var i=0;i<T.phases.length;i++){var p=T.phases[i];if(e<p.start+p.secs*1000)return i}return -1}
function tTick(){
  if(T.status!=='running')return;
  var e=tElapsed(),i=tLocate(e);
  if(i<0){tFinish(T.cfg.mode==='fortime'?'cap':'done');return}
  var p=T.phases[i];
  if(i!==T.idx){
    if(T.idx>=0||i>0){if(p.kind==='work')tBeep(880,380);else if(p.kind==='rest')tBeep(520,380)}
    T.idx=i;T.lastRem=-1;
  }
  if(p.secs!==Infinity&&!p.up||p.kind==='prep'){
    var rs=Math.ceil((p.start+p.secs*1000-e)/1000);
    if(rs>=1&&rs<=3&&rs!==T.lastRem){T.lastRem=rs;tBeep(660,130)}
  }
  tPaint();
}
function tPaint(){
  var clock=document.getElementById('tClock');if(!clock)return;
  var e=tElapsed(),i=T.status==='done'?T.phases.length-1:Math.max(0,tLocate(e));if(i<0)i=T.phases.length-1;
  var p=T.phases[i],pe=Math.max(0,e-p.start),fin=p.secs!==Infinity;
  document.getElementById('tClock').textContent=p.up?clk(Math.floor(pe/1000)):clk(Math.ceil((p.secs*1000-pe)/1000));
  document.getElementById('tLabel').textContent=T.status==='paused'?'Paused · '+p.label:p.label;
  document.getElementById('tRound').textContent=p.of?'Round '+p.round+' of '+p.of:'';
  document.getElementById('tBar').style.width=(fin?Math.min(100,pe/(p.secs*1000)*100):0)+'%';
  var tot=document.getElementById('tTot');
  if(p.kind==='prep')tot.textContent='Starting in '+Math.ceil((p.secs*1000-pe)/1000)+' s';
  else if(T.phases.length>2&&T.cfg.mode!=='amrap')tot.textContent='Total left '+clk(Math.ceil((T.total-e)/1000));
  else if(p.up&&fin)tot.textContent='Cap '+clk(p.secs);
  else tot.textContent='';
  var box=document.getElementById('tBox');box.className='clock '+(p.kind==='prep'?'prep':p.kind==='rest'?'rest':'work');
  var r=document.getElementById('tRounds');if(r)r.textContent=T.rounds;
}
function tStart(){
  try{if(!T.ac){var C=window.AudioContext||window.webkitAudioContext;if(C)T.ac=new C()}if(T.ac&&T.ac.state==='suspended')T.ac.resume()}catch(e){}
  tBuild();T.status='running';T.accum=0;T.lastTs=Date.now();T.idx=-1;T.lastRem=-1;T.rounds=0;T.result=null;
  clearInterval(T.iv);T.iv=setInterval(tTick,100);tWake(true);render();tTick();
}
function tPause(){T.accum=tElapsed();T.status='paused';clearInterval(T.iv);render()}
function tResume(){T.lastTs=Date.now();T.status='running';clearInterval(T.iv);T.iv=setInterval(tTick,100);render();tTick()}
function tReset(){clearInterval(T.iv);T.status='idle';T.accum=0;T.result=null;tWake(false);render()}
function tFinish(why){
  var e=Math.min(tElapsed(),T.total),m=T.cfg.mode,s='';
  clearInterval(T.iv);
  var ftSec=Math.max(0,Math.round((e-PREP*1000)/1000));
  if(m==='emom')s='EMOM '+tn('emomMin')+' min'+(tn('emomSec')!==60?', every '+tn('emomSec')+' s':'')+', completed';
  else if(m==='tabata')s='Tabata '+tn('tabRounds')+' rounds, '+tn('tabWork')+' s on / '+tn('tabRest')+' s off, completed';
  else if(m==='intervals')s=tn('ivRounds')+' rounds, '+tn('ivWork')+' s on / '+tn('ivRest')+' s off, completed';
  else if(m==='amrap')s='AMRAP '+tn('amrapMin')+' min: '+T.rounds+(T.rounds===1?' round':' rounds');
  else s=why==='cap'?'For time: time cap '+clk(tn('ftCap')*60)+' reached':'For time: '+clk(ftSec);
  T.result={summary:s};T.status='done';
  tBeep(880,200);tBeep(880,200,280);tBeep(1175,420,560);
  tWake(false);render();
}
function viewTimer(){
  var m=T.cfg.mode,st=T.status;
  var modes='<div class="modes" role="group" aria-label="Timer type">'+TMODES.map(function(x){return '<button type="button" class="mbtn" data-act="tmode" data-m="'+x[0]+'" aria-pressed="'+(m===x[0])+'"'+(st!=='idle'?' disabled':'')+'>'+x[1]+'</button>'}).join('')+'</div>';

    body='<div class="clock work" id="tBox" aria-live="off"><span class="ph" id="tLabel"></span><span class="tt" id="tClock" role="timer">0:00</span>'+

    if(m==='amrap')body+='<div class="panel pad tally"><button class="btn ghost round" data-act="tminus" aria-label="Remove a round">−</button><div style="text-align:center"><div class="n" id="tRounds">'+T.rounds+'</div><div class="muted">rounds</div></div><button class="btn round" data-act="tplus" aria-label="Add a round">+</button></div>';
    body+='<div class="t-actions">'+(st==='running'?'<button class="btn" data-act="tpause">Pause</button>':'<button class="btn" data-act="tresume">Resume</button>')+
      (m==='fortime'?'<button class="btn ghost" data-act="tfinish">Finish</button>':'')+
      '<button class="btn ghost" data-act="treset">Reset</button></div><div class="actions" style="justify-content:center">'+sound+'</div>';
  }
  return '<section class="sec"><h2>Timer</h2>'+modes+body+'</section>';

      toast(!g?'Logged '+move+': '+fmtVal(unit,v):better(unit,v,g.best)?'New PR: '+move+', '+fmtVal(unit,v):'Logged. Your best is still '+fmtVal(unit,g.best));
    }else if(type==='session'){
      var feel=Number((sheet.querySelector('input[name=feel]:checked')||{}).value||4),sd={date:val('f-date'),feel:feel,note:val('f-note')},any=!!sd.note;
      if(!sd.date)return err('Pick a date.');
      SECTIONS.forEach(function(x){sd[x[0]]=val('f-'+x[0]);if(sd[x[0]])any=true});
      if(!any)return err('Fill in at least one block, or add a note.');
      if(sheet.dataset.id){await store.patch(sheet.dataset.id,sd);toast('Session updated')}
      else{sd.kind='session';await store.add(sd);toast('Session logged')}
      closeSheet();calSel=sd.date;calMonth=sd.date.slice(0,7)+'-01';if(tab==='calendar')render();
    }else if(type==='goal'){
      var u=val('f-unit'),s=parseVal(u,val('f-start')),tg=parseVal(u,val('f-target')),title=val('f-title');
      if(!title)return err('Give the goal a name.');
      if(!isFinite(s)||!isFinite(tg))return err(u==='time'?'Enter times as m:ss.':'Enter numbers for where you are and your target.');
      if(s===tg)return err('Your target should differ from where you are now.');
      await store.add({kind:'goal',title:title,move:val('f-move'),unit:u,start:s,target:tg,current:s,due:val('f-due'),done:false});
      closeSheet();toast('Goal saved');
    }else if(type==='win'){
      if(!val('f-title'))return err('Say what happened.');
      if(!val('f-date'))return err('Pick a date.');
      await store.add({kind:'win',title:val('f-title'),date:val('f-date'),note:val('f-note')});
      closeSheet();toast('Win added');
    }else if(type==='progress'){
      var g2=items.find(function(i){return i.id===sheet.dataset.id});if(!g2){closeSheet();return}
      var c=parseVal(g2.unit,val('f-cur'));
      if(!isFinite(c))return err(g2.unit==='time'?'Enter the time as m:ss.':'Enter a number.');
      await store.patch(g2.id,{current:c});closeSheet();toast('Progress updated');
    }
  }catch(e){err('Could not save. Check your connection and try again.')}
}

/* ---------- events ---------- */
var armed=null;
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='close'){closeSheet();return}
  if(a==='add-pr'||a==='add-goal'||a==='add-win'||a==='add-session'){openSheet(a.slice(4),el.dataset.date?{date:el.dataset.date}:null);return}
  if(a==='edit-session'){var es=items.find(function(i){return i.id===el.dataset.id});if(es)openSheet('session',es);return}
  if(a==='tmode'){T.cfg.mode=el.dataset.m;tSave();render();return}
  if(a==='tsound'){T.cfg.sound=!T.cfg.sound;tSave();el.textContent='Sound: '+(T.cfg.sound?'on':'off');return}
  if(a==='tstart'){tStart();return}
  if(a==='tpause'){tPause();return}
  if(a==='tresume'){tResume();return}
  if(a==='treset'){tReset();return}
  if(a==='tfinish'){tFinish('done');return}
  if(a==='tplus'||a==='tminus'){T.rounds=Math.max(0,T.rounds+(a==='tplus'?1:-1));var rr=document.getElementById('tRounds');if(rr)rr.textContent=T.rounds;if(a==='tplus')tBeep(1000,70);return}
  if(a==='tlog'){openSheet('session',{date:today(),metcon:T.result?T.result.summary:''});return}
  if(a==='sblock'){searchBlock=el.dataset.b;document.querySelectorAll('[data-act=sblock]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.b===searchBlock))});$('#results').innerHTML=searchResultsHTML();return}
  if(a==='openpr'){openKeys.add(el.dataset.key);location.hash='#prs';return}
  if(a==='seldate'){calSel=el.dataset.date;render();return}
  if(a==='calprev'||a==='calnext'){var cm=parseYmd(calMonth);calMonth=ymd(new Date(cm.getFullYear(),cm.getMonth()+(a==='calnext'?1:-1),1));render();return}
  if(a==='caltoday'){calSel=today();calMonth=calSel.slice(0,7)+'-01';render();return}
  if(a==='opencal'){calSel=el.dataset.date;calMonth=calSel.slice(0,7)+'-01';if(location.hash==='#calendar')render();else location.hash='#calendar';return}
  if(a==='idea'){var t=document.getElementById('f-title');if(t){t.value=el.dataset.v;t.focus()}return}
  if(a==='toggle'){var k=el.dataset.key;if(openKeys.has(k))openKeys.delete(k);else openKeys.add(k);render();return}
  if(a==='progress'){var g=items.find(function(i){return i.id===el.dataset.id});if(g)openSheet('progress',g);return}
  try{
    if(a==='reach'){
      var g3=items.find(function(i){return i.id===el.dataset.id});if(!g3)return;
      await store.patch(g3.id,{done:true,doneAt:today(),current:g3.target});
      await store.add({kind:'win',title:'Goal reached: '+g3.title,date:today(),note:'',auto:true});
      toast('Goal reached. Added to your wins.');return;
    }
    if(a==='del'){
      if(armed!==el){
        if(armed){armed.textContent=armed.dataset.label;}
        armed=el;el.dataset.label=el.textContent;el.textContent='Tap again to delete';
        setTimeout(function(){if(armed===el&&document.contains(el)){el.textContent=el.dataset.label;armed=null}},3500);return;
      }
      armed=null;await store.remove(el.dataset.id);toast('Deleted');
    }
  }catch(x){toast('Could not save. Try again.')}
});
sheet.addEventListener('submit',submitSheet);
sheet.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-move'){
    var n=t.value.trim();
    if(sheet.dataset.type==='pr'&&MOVES[n]){document.getElementById('f-unit').value=MOVES[n]}
    if(sheet.dataset.type==='goal'){
      var gs=prGroups(items),low=n.toLowerCase();
      var gr=gs.find(function(x){return x.name.toLowerCase()===low});
      var unit=gr?gr.unit:MOVES[n];
      if(unit)document.getElementById('f-unit').value=unit;
      if(gr){document.getElementById('f-start').value=gr.unit==='time'?fmtTime(gr.best):num(gr.best);var ti=document.getElementById('f-title');if(!ti.value)ti.value=n+' goal'}
    }
  }
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&T.status==='running')tWake(true)});
document.addEventListener('input',function(e){
  if(e.target.id&&e.target.id.indexOf('c-')===0){T.cfg[e.target.id.slice(2)]=e.target.value;tSave();var su=document.getElementById('tSum');if(su)su.textContent=tSummaryLine();return}
  if(e.target.id==='q'){searchQ=e.target.value;var r=$('#results');if(r)r.innerHTML=searchResultsHTML()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheetWrap.hidden)closeSheet()});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
(function(){
  var d=new Date();$('#date').textContent=DAYS_L[d.getDay()]+' '+d.getDate()+' '+MONTHS_L[d.getMonth()];
  $('#moves').innerHTML=Object.keys(MOVES).map(function(m){return '<option value="'+esc(m)+'"></option>'}).join('');
  route();initStore();
})();
})();
</script>
